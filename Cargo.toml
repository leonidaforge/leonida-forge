[workspace]
resolver = "3"
members = ["apps/cli", "apps/desktop", "crates/binary", "crates/core", "crates/model", "crates/renderer", "crates/rage9", "crates/scene", "crates/text", "crates/texture"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "GPL-3.0-or-later"
repository = "https://github.com/leonidaforge/leonida-forge"
publish = false

[workspace.dependencies]
lforge-binary = { path = "crates/binary" }
lforge-core = { path = "crates/core" }
lforge-model = { path = "crates/model" }
lforge-renderer = { path = "crates/renderer" }
lforge-rage9 = { path = "crates/rage9" }
lforge-scene = { path = "crates/scene" }
lforge-text = { path = "crates/text" }
lforge-texture = { path = "crates/texture" }

bcdec_rs = "0.2.1"
bytemuck = { version = "1.25", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
encoding_rs = "0.8"
env_logger = "0.11"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
futures = "0.3"
glam = { version = "0.34", features = ["bytemuck"] }
half = "2.7"
# GPUI is not published in a current form; pin the Zed revision it is taken from.
gpui = { git = "https://github.com/zed-industries/zed", rev = "f00a94318c059f03892e04f82343e899fbfaa844", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "f00a94318c059f03892e04f82343e899fbfaa844", default-features = false }
iced-x86 = { version = "1.22", default-features = false, features = ["std", "decoder", "instr_info"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
jpeg-decoder = { version = "0.3", default-features = false }
log = "0.4"
memchr = "2.8"
pollster = "1.0"
roxmltree = "0.21"
rsa = { version = "0.9.8", default-features = false, features = ["std", "sha2", "getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
unicode-width = "0.2"
wgpu = "30.0"
windows = "0.62"
zeroize = "1.9"
zip = { version = "9.4", default-features = false, features = ["deflate"] }

# Zed patches async-task for a waker identity fix that GPUI's executor relies on.
# Patches of a dependency's workspace do not propagate, so it is repeated here.
[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task", rev = "41fd3359c75e221bd8b187a8ee361aa309c1714c" }
