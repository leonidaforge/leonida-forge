name: Windows x64 Alpha

# Dispatch only on purpose. A tag trigger and a release job stay absent until
# public publication is explicitly approved.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: windows-x64-alpha-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked

      - name: Build release binaries
        run: pwsh -NoProfile -File scripts/build-windows-x64.ps1

      - name: Verify and package
        run: pwsh -NoProfile -File scripts/package-windows-x64.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-alpha
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
