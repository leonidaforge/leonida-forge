
name: Windows x64 Alpha

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      # Install the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked

      - name: Build release binaries
        run: pwsh -NoProfile -File scripts/build-windows-x64.ps1

      - name: Verify and package
        run: pwsh -NoProfile -File scripts/package-windows-x64.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-alpha
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish Alpha Pre-Release
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-alpha
          path: dist

      - name: Publish GitHub Pre-Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: alpha-${{ github.run_number }}-${{ github.run_attempt }}
          name: Leonida Forge Alpha #${{ github.run_number }}.${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          draft: false
          make_latest: "false"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.sha256
